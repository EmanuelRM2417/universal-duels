name = "universal-duels-editor-privado"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "EDITOR_DRAFTS"
id = "453d2d63210e42149663b5771e76a803"

# Separate draft KV from the public snapshot KV. These bindings use the same public
# namespace/bucket as the game Worker, but only the private, Access-gated API writes.
[[kv_namespaces]]
binding = "PUBLIC_CONTENT"
id = "453d2d63210e42149663b5771e76a803"

[[r2_buckets]]
binding = "EDITOR_SPRITES"
bucket_name = "universal-duels-sprites-test"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/editor-api/*"]

[vars]
ACCESS_TEAM_DOMAIN = "nameless-water-b29a.cloudflareaccess.com"
ACCESS_AUD = "c38edfabcf3221f1ad4fa4c1b9d69e99600c921b83e99fc197c083afd9fa205c"
EDITOR_EMAIL = "2417erm@gmail.com"
