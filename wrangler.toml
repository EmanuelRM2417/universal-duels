name = "universal-duels-editor-privado"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "EDITOR_DRAFTS"
id = "453d2d63210e42149663b5771e76a803"

# Existing catalog-v1 drafts and published snapshots share this KV namespace.
# Keep distinct bindings because the application uses different key prefixes.
[[kv_namespaces]]
binding = "PUBLIC_CONTENT"
id = "453d2d63210e42149663b5771e76a803"

[[r2_buckets]]
binding = "EDITOR_SPRITES"
bucket_name = "universal-duels-sprites-test"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/editor-api/*"]

[vars]
ACCESS_TEAM_DOMAIN = "nameless-water-b29a.cloudflareaccess.com"
ACCESS_AUD = "99bc017b30ecadb6150e289655d2c2fcdf043e1d65c3fa644d7df00f2350e346"
EDITOR_EMAIL = "2417erm@gmail.com"
