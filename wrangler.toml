name = "universalduels"
main = "worker.js"
compatibility_date = "2026-09-29"

# Conservar variables de texto creadas desde Cloudflare Dashboard tras nuevos despliegues.
keep_vars = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Alpha 0.2: main lee únicamente el último parche publicado manualmente desde el editor.
[[kv_namespaces]]
binding = "PUBLIC_CONTENT"
id = "453d2d63210e42149663b5771e76a803"

# Alpha 0.2: los sprites públicos se copian a una ruta versionada al cargar cada parche.
[[r2_buckets]]
binding = "PUBLIC_SPRITES"
bucket_name = "universal-duels-sprites-test"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

# El valor secreto NO debe guardarse en este archivo ni en GitHub.
# Se requiere que ya exista en Cloudflare para permitir desplegar.
[secrets]
required = ["UD_MONITOR_SECRET"]

# GOOGLE_CLIENT_ID es un identificador publico (NO el Client Secret).
# Para administrarlo en el repositorio, agrega el valor REAL obtenido en Google Cloud:
#
# [vars]
# GOOGLE_CLIENT_ID = "TU_CLIENT_ID_REAL.apps.googleusercontent.com"
#
# Si no lo fijas ahi, keep_vars = true mantiene el configurado en el Dashboard.
