function effectRows(u){if(!u)return'<p>Sin personaje.</p>';const names={attack:'Ataque',specialAttack:'Ataque especial',defense:'Defensa',specialDefense:'Defensa especial',speed:'Velocidad',accuracy:'Precisión',evasion:'Evasión',criticalChance:'Crítico'},core=['attack','defense','specialAttack','specialDefense','speed'];let a=[];if(u.baseStats&&u.currentStats)a.push(`<div class="stat-comparison"><strong>Stats base → actuales</strong>${core.map(k=>`<div>${names[k]}: ${u.baseStats[k]} → <b>${u.currentStats[k]}</b></div>`).join('')}</div>`);if(u.status)a.push(`<button class="effect-chip battle-effect-detail" data-status="${esc(u.status.id)}" data-side="${u.side}" data-team="${u.teamIndex}">${esc(catalog.statuses?.[u.status.id]?.name||u.status.id)}</button>`);for(const k of Object.keys(names)){const v=(u.stages?.[k]||0)+(u.environmentStages?.[k]||0)+(u.statusStages?.[k]||0)+(u.passiveStages?.[k]||0);if(v||(k==='criticalChance'&&u.environmentCrit))a.push(`<button class="effect-chip battle-effect-detail" data-stat="${k}" data-side="${u.side}" data-team="${u.teamIndex}">${names[k]} ${v>0?'+':''}${v}${k==='criticalChance'&&u.environmentCrit?` · Entorno ${Number(u.environmentCrit)>0?'+':''}${u.environmentCrit}%`:''}</button>`)}for(const e of u.effects||[])a.push(`<span class="effect-chip">${esc(e.id)}${e.turns?' · '+e.turns+' r.':''}</span>`);return a.join('')||'<p>Sin efectos.</p>'}
function environmentEffectText(e){const names={damage_percent:'Daño',heal_percent:'Curación',stat_change:'Cambio de stat',critical_change:'Cambio de crítico',remove_status:'Elimina estado',block_status:'Bloquea estados',cooldown_change:'Modifica cooldowns',cooldown_on_use:'Cooldown al usar',immunity:'Inmunidad'};let p=[names[e.type]||e.type];if(e.value!==undefined&&e.value!==null)p.push(String(e.value));if(e.timing)p.push(e.timing);if(e.chance!==undefined)p.push(`Prob. ${e.chance}%`);return p.join(' · ')}
function environmentBody(){return[['Clima','weather','weathers','weatherTurns'],['Campo','field','fields','fieldTurns'],['Escenario','scenario','scenarios','scenarioTurns']].map(([l,k,c,t])=>{const id=battleLastData?.[k],e=catalog?.[c]?.[id],description=e?.description||'Sin descripción.';return`<div class="environment-card"><h4>${l}: ${esc(e?.name||'Ninguno')}</h4>${id?`<p>${battleLastData[t]} rondas restantes</p><p>${esc(description)}</p>`:''}</div>`}).join('')}
function typeTableBody(){const types=Object.keys(TYPE_NAMES);return`<div class="type-legend"><span><b class="a20">↑ / ↓</b> ±20% por tipos</span><span><b class="a40">↑↑ / ↓↓</b> ±40%</span><span><b class="a60">↑↑↑ / ↓↓↓</b> ±60%</span><span><b class="a60">INMUNE</b> inmunidad de tipo</span><span><b class="stab">STAB</b> el tipo del movimiento coincide con el usuario</span></div><p class="muted">Estos indicadores muestran únicamente relaciones de tipo. No incluyen stats, crítico, clima, campo, escenario, habilidades ni otros modificadores.</p><div class="type-table-wrap"><table class="type-mini"><tr><th>ATQ ↓ / DEF →</th>${types.map(t=>`<th>${typeMark(t,true)}</th>`).join('')}</tr>${types.map(a=>`<tr><th>${typeMark(a,true)}</th>${types.map(d=>{const r=chart?.[a]?.[d]||'neutral';return`<td>${r==='eficaz'?'<span class="type-good">+20%</span>':r==='ineficaz'?'<span class="type-bad">−20%</span>':r==='inmune'?'<span class="type-immune">INM</span>':'<span class="type-zero">0</span>'}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function logBody(){let out='',open=false;for(const l of displayedBattleLog){if(l.startsWith('— Ronda ')){if(open)out+='</div>';out+=`<div class="battle-log-round"><strong>${esc(formatLine(l))}</strong>`;open=true}else out+=`<div>${esc(formatLine(l))}</div>`}return out+(open?'</div>':'')}
function openModal(kind){$('battleModalClose').hidden=false;battleModalKind=kind;const p=pUnits(battleLastData),title=$('battleModalTitle'),body=$('battleModalBody');if(kind==='player'){title.textContent='Efectos · equipo aliado';body.innerHTML=p.playerActive.map(u=>`<div class="environment-card"><h4>${esc(u.name)}</h4>${effectRows(u)}</div>`).join('')}else if(kind==='enemy'){title.textContent='Efectos · equipo rival';body.innerHTML=p.enemyActive.map(u=>`<div class="environment-card"><h4>${esc(u.name)}</h4>${effectRows(u)}</div>`).join('')}else if(kind==='environment'){title.textContent='Campo · Clima · Escenario';body.innerHTML=environmentBody()}else if(kind==='types'){title.textContent='Tabla de tipos';body.innerHTML=typeTableBody()}else{title.textContent='Battle log';body.innerHTML=logBody()}body.querySelectorAll('.battle-effect-detail').forEach(b=>b.onclick=()=>{const side=b.dataset.side,team=Number(b.dataset.team),u=(side==='left'?battleLastData.leftTeam:battleLastData.rightTeam)?.[team];if(b.dataset.status){title.textContent=catalog.statuses?.[b.dataset.status]?.name||b.dataset.status;body.innerHTML='<pre style="white-space:pre-wrap">'+esc(statusEffectText(b.dataset.status))+'</pre>'}else if(b.dataset.stat){title.textContent='Desglose · '+u.name;body.innerHTML=statBreakdown(u,b.dataset.stat)}});$('battleModal').hidden=false;wireTypeMarks()}
function commitAction(act){actionDraft=actionDraft.filter(a=>a.slot!==act.slot);actionDraft.push(act);$('battleModal').hidden=true;const need=pUnits(battleLastData).playerActive.filter(u=>u.hp>0).length;if(actionDraft.length>=need){pendingLocalOrder={actions:clone(actionDraft)};send({type:'select_order',order:pendingLocalOrder});}renderBattle(battleLastData,'');}
function wireControls(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const slot=nextActionSlot(battleLastData),m=move(b.dataset.move);if(battle.mode==='doubles')openTargetPicker(slot,b.dataset.move);else{const user=pUnits(battleLastData).playerActive.find(u=>u.activeSlot===slot),kind=targetKind(m);let target=null;if(kind==='single')target={side:pUnits(battleLastData).enemySide,slot:0};maybeSwitchChoice({slot,move:b.dataset.move,...(target?{target}:{})},m,user);}});document.querySelectorAll('[data-move-info]').forEach(b=>b.onclick=()=>{const m=move(b.dataset.moveInfo);if(!m)return;const slot=nextActionSlot(battleLastData),u=pUnits(battleLastData).playerActive.find(x=>Number(x.activeSlot)===Number(slot));$('battleModalTitle').textContent=m.name||b.dataset.moveInfo;$('battleModalBody').innerHTML='<div class="environment-card">'+moveInfo(m,u)+'</div>';$('battleModal').dataset.replacing='';$('battleModalClose').hidden=false;$('battleModal').hidden=false;});$('battleSwitch')?.addEventListener('click',openSwitchPicker);$('battleCatalog')?.addEventListener('click',()=>udPracticeOpenCatalog());$('battleUndoAction')?.addEventListener('click',()=>{actionDraft.pop();pendingLocalOrder=null;renderBattle(battleLastData,'')});$('battleCancelMove')?.addEventListener('click',()=>{actionDraft=[];pendingLocalOrder=null;renderBattle(battleLastData,'')});}
function openReplacementPicker(){if(battle.replacementSubmitted||$('battleModal').dataset.replacing==='true')return;const side=playerSide(),needed=battle.state.needsReplacement?.[side]||[],active=battle.state[side+'ActiveIndexes']||[],p=pUnits(battle.state),available=p.playerTeam.map((u,i)=>({u,i})).filter(x=>x.u.hp>0&&!active.includes(x.i));const required=needed.slice(0,available.length),selected=[];if(!required.length)return;const modal=$('battleModal');modal.dataset.replacing='true';$('battleModalClose').hidden=true;$('battleModalTitle').textContent='Elegí quién entra';const draw=()=>{$('battleModalBody').innerHTML=`<p class="muted">Seleccioná ${required.length} sustitución(es).</p>`+required.slice(selected.length).map(slot=>`<div class="environment-card"><strong>Posición ${slot+1}</strong>${available.filter(x=>!selected.some(y=>y.teamIndex===x.i)).map(x=>`<button class="battle-switch-choice" data-slot="${slot}" data-i="${x.i}">${esc(x.u.name)} · ${x.u.hp}/${x.u.maxHp} PS</button>`).join('')}</div>`).join('');$('battleModalBody').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{selected.push({slot:Number(b.dataset.slot),teamIndex:Number(b.dataset.i)});if(selected.length===required.length){modal.dataset.replacing='';$('battleModalClose').hidden=false;modal.hidden=true;send({type:'replacement',choices:selected});}else draw();});};draw();modal.hidden=false;}
document.querySelectorAll('[data-battle-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.battleModal));$('battleModalClose').onclick=()=>{if($('battleModal').dataset.replacing==='true')return;$('battleModal').hidden=true;};$('battleModal').onclick=e=>{if(e.target.id==='battleModal'&&e.currentTarget.dataset.replacing!=='true'){e.currentTarget.hidden=true;}};$('udBattleSpeedToggle').onclick=()=>{battleSpeed=battleSpeed==='x2'?'normal':'x2';$('udBattleSpeedToggle').textContent=battleSpeed==='x2'?'x2':'x1';$('battleStage').style.setProperty('--ud-speed-multiplier',battleSpeed==='x2'?'0.5':'1');};


/* Optional practice clock. No deadline is enforced when unchecked. */
const udPracticeTimerKey='ud-alpha06-practice-timed';
const udPracticeTimed=()=>!!$('udPracticeTimerEnabled')?.checked;
const udPracticeTimerState={key:'',deadline:0,firing:false};
$('udPracticeTimerEnabled').checked=localStorage.getItem(udPracticeTimerKey)==='true';
$('udPracticeTimerEnabled').onchange=()=>{localStorage.setItem(udPracticeTimerKey,String(udPracticeTimed()));udPracticeTimerState.key='';};
function udPracticeUpdateTimer(){
 const el=$('battleHudTimer');if(!el)return;
 if(!udPracticeTimed()||!session||session.status!=='playing'||battleAnimating||busy){el.textContent='';return;}
 if(!['action','replacement'].includes(session.phase)){el.textContent='';return;}
 const key=token+':'+session.round+':'+session.phase;
 if(key!==udPracticeTimerState.key){udPracticeTimerState.key=key;udPracticeTimerState.deadline=Date.now()+(session.phase==='replacement'?15000:60000)*(session.mode==='doubles'?2:1);udPracticeTimerState.firing=false;}
 const seconds=Math.max(0,Math.ceil((udPracticeTimerState.deadline-Date.now())/1000));el.textContent=seconds+' s';
 if(seconds===0&&!udPracticeTimerState.firing){udPracticeTimerState.firing=true;udPracticeExpire();}
}
async function udPracticeExpire(){
 if(!session||session.status!=='playing'||busy)return;
 if(session.phase==='replacement'){
  const needed=session.state?.needsReplacement?.left||[],active=session.state?.leftActiveIndexes||[],team=session.state?.leftTeam||[];
  const available=team.map((u,i)=>u.hp>0&&!active.includes(i)?i:-1).filter(i=>i>=0);
  const choices=needed.map(slot=>({slot,teamIndex:available.splice(Math.floor(Math.random()*available.length),1)[0]})).filter(x=>x.teamIndex!==undefined);
  if(choices.length){send({type:'replacement',choices});return;}
 }
 busy=true;try{const d=await api('/api/practice/'+token,{method:'POST',body:JSON.stringify({operation:'surrender'})});session=d.practice;showSession('Tiempo agotado.');}catch(e){notice(e.message);}finally{busy=false;}
}
setInterval(udPracticeUpdateTimer,250);
function udPracticeLoadTeams(){try{const teams=JSON.parse(localStorage.getItem('ud-alpha06-named-teams')||'[]');if(!Array.isArray(teams))return;const select=$('udPracticeSavedTeam');select.innerHTML='<option value="">Elegir equipo guardado</option>'+teams.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');const preferred=localStorage.getItem('ud-alpha06-selected-team')||'';if(teams.some(t=>t.name===preferred)){select.value=preferred;selected=teams.find(t=>t.name===preferred).ids.filter(id=>entity(id)).slice(0,8);}}catch{}}
$('udPracticeSavedTeam').onchange=()=>{try{const t=JSON.parse(localStorage.getItem('ud-alpha06-named-teams')||'[]').find(x=>x.name===$('udPracticeSavedTeam').value);if(!t)return;selected=t.ids.filter(id=>entity(id)).slice(0,8);localStorage.setItem('ud-alpha06-selected-team',t.name);renderPracticeRoster();}catch{}};

const KEY='universal-duels-practice-v1';let token=localStorage.getItem(KEY),session=null,selected=[],busy=false;
const notice=m=>{$('notice').textContent=$('battleView').classList.contains('hidden')?m:''};
async function api(path,options={}){const r=await fetch(path,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la operación.');return d;}
function refreshSelection(){selected=[...$('roster').querySelectorAll('button.selected')].map(e=>e.dataset.entity);$('selectionCount').textContent=`Seleccionados: ${selected.length}/8`;$('start').disabled=selected.length<1||selected.length>8;}
function practiceTags(e){return [...new Set([...(e.definition?.tags||[]),...Object.values(catalog.tags||{}).filter(t=>(t.definition?.entityIds||[]).includes(e.id)).map(t=>t.name)])];}
function renderPracticeRoster(){const q=$('practiceSearch')?.value.trim().toLocaleLowerCase('es')||'',t=$('practiceTypeFilter')?.value||'',v=$('practiceStatSort')?.value||'name-asc',[sort,dir]=v.split(/-(?=[^-]+$)/),list=Object.values(catalog.entities||{}).filter(e=>(!t||e.definition?.types?.includes(t))&&(!q||[e.name,...practiceTags(e)].join(' ').toLocaleLowerCase('es').includes(q))).sort((a,b)=>sort==='name'?(dir==='desc'?b.name.localeCompare(a.name,'es'):a.name.localeCompare(b.name,'es')):(dir==='desc'?Number(b.definition?.[sort]||0)-Number(a.definition?.[sort]||0):Number(a.definition?.[sort]||0)-Number(b.definition?.[sort]||0)));$('roster').innerHTML=list.map(e=>{const url=spriteUrl(e.id);return`<button class="entity practice-entity ${selected.includes(e.id)?'selected':''}" data-entity="${esc(e.id)}">${url?`<span class="thumb"><img src="${url}" alt=""></span>`:''}<span><strong>${esc(e.name)}</strong><span class="types">${(e.definition?.types||[]).map(t=>typeMark(t)).join('')}</span></span></button>`}).join('');$('roster').querySelectorAll('[data-entity]').forEach(b=>b.onclick=()=>{const id=b.dataset.entity,idx=selected.indexOf(id);if(idx>=0)selected.splice(idx,1);else if(selected.length<8)selected.push(id);renderPracticeRoster()});$('selectionCount').textContent=`Seleccionados: ${selected.length}/8`;$('start').disabled=selected.length<1||selected.length>8;wireTypeMarks();}

function makeBattle(){if(!session)return null;return{revision:session.revision,mode:session.mode,round:session.round,phase:session.phase,status:session.status,submitted:false,state:session.state,replacementSubmitted:false};}
function showSession(message=''){if(!session)return;const sc=catalog?.scenarios?.[session.state?.scenario]?.definition||{};udSound.context('battle',{scenarioId:session.state?.scenario,soundId:sc.soundId,scenarioVolume:Number(sc.soundVolume??100),revision:session.revision||revision});battle=makeBattle();$('setup').classList.add('hidden');$('battleView').classList.remove('hidden');$('roundLabel').textContent=`Ronda ${session.round}`;$('new').classList.toggle('hidden',session.status!=='finished');$('surrender').classList.toggle('hidden',session.status==='finished');battleDisplayData=clone(session.state);battleLastData=battleDisplayData;displayedBattleLog=[...(session.state.log||[])];actionDraft=[];pendingLocalOrder=null;renderBattle(battleDisplayData,message||(session.status==='finished'?resultText():''));if(session.status==='finished')$('battleStage').insertAdjacentHTML('beforeend',`<div class="practice-result" role="status">${esc(resultText())}</div>`);}
async function showInitialSession(){showSession('Comienza el entrenamiento.');const final=clone(session.state);for(const k of ['weather','field','scenario'])battleDisplayData[k]='';for(const k of ['weatherTurns','fieldTurns','scenarioTurns'])battleDisplayData[k]=0;for(const side of ['left','right'])for(const u of battleDisplayData[side+'Active']||[]){u.status=null;u.environmentStages={};u.statusStages={};}displayedBattleLog=[];renderBattle(battleDisplayData,'Comienza el entrenamiento.');await animateLogLines(session.lastTurnLogs||[],final,(session.visualEvents||[]).map(e=>({...e,localIndex:e.logIndex})));}
function resultText(){return{victory:'¡Ganaste la práctica!',defeat:'Perdiste la práctica.',draw:'La práctica terminó en empate.',surrender:'Te rendiste.'}[session?.outcome]||'Práctica finalizada.';}
function newLogs(previous,next){const old=previous||[],fresh=next||[];for(let common=Math.min(old.length,fresh.length);common>=0;common--)if(old.slice(old.length-common).join('\u0001')===fresh.slice(0,common).join('\u0001'))return fresh.slice(common);return fresh.slice(-16);}
async function send(x){if(x.type==='cancel_selection')return;if(busy||!session||session.status!=='playing')return;const payload=x.type==='select_order'?{operation:'turn',order:x.order}:x.type==='replacement'?{operation:'replacement',choices:x.choices}:null;if(!payload)return;busy=true;const previous=[...(session.state.log||[])];battle.submitted=true;if(x.type==='replacement')battle.replacementSubmitted=true;renderBattle(battleLastData,'Resolviendo ronda…');try{const d=await api('/api/practice/'+token,{method:'POST',body:JSON.stringify(payload)});session=d.practice;const added=newLogs(previous,session.state.log||[]);battle=makeBattle();battle.submitted=false;displayedBattleLog=previous;const replay=session.lastTurnLogs||added,visual=(session.visualEvents||[]).map(e=>({...e,localIndex:e.logIndex}));await animateLogLines(replay,session.state,visual);busy=false;showSession();notice(session.status==='finished'?resultText():'');}catch(e){notice('No se pudo resolver: '+e.message);actionDraft=[];pendingLocalOrder=null;busy=false;battle.submitted=false;battle.replacementSubmitted=false;$('battleModal').dataset.replacing='';renderBattle(battleLastData,'Elegí la acción nuevamente.');return;}finally{busy=false;if(battle)battle.submitted=false;}}
async function refresh(){if(!token){$('resume').classList.add('hidden');return;}try{const d=await api('/api/practice/'+token);session=d.practice;$('resume').classList.toggle('hidden',session.status!=='playing');$('resume').textContent='Reanudar práctica · ronda '+session.round;}catch(e){token=null;session=null;localStorage.removeItem(KEY);$('resume').classList.add('hidden');notice(e.message);}}
$('start').onclick=async()=>{if(busy)return;try{if(!selected.length)throw Error('Seleccioná un personaje.');busy=true;if(token){try{await api('/api/practice/'+token,{method:'POST',body:JSON.stringify({operation:'surrender'})});}catch{ /* Una partida ya expirada no debe bloquear el nuevo entrenamiento. */ }}const freshToken=crypto.randomUUID()+crypto.randomUUID();const ids=Object.keys(catalog.entities),size=Number($('enemySize').value);for(let i=ids.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}const d=await api('/api/practice',{method:'POST',body:JSON.stringify({token:freshToken,mode:$('mode').value,difficulty:$('difficulty').value,leftTeam:selected,rightTeam:ids.slice(0,size)})});token=d.token;localStorage.setItem(KEY,token);session=d.practice;await showInitialSession();notice('Entrenamiento nuevo iniciado.');}catch(e){notice(e.message);}finally{busy=false;}}
$('practiceSearch').oninput=renderPracticeRoster;$('practiceTypeFilter').onchange=renderPracticeRoster;$('practiceStatSort').onchange=renderPracticeRoster;
$('resume').onclick=()=>showSession('Práctica reanudada.');
$('random').onclick=()=>{const ids=Object.keys(catalog.entities);for(let i=ids.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}selected=ids.slice(0,8);renderPracticeRoster()};
$('new').onclick=()=>{if(session?.status!=='finished')return;udSound.context('lobby',{revision});session=null;battle=null;token=null;localStorage.removeItem(KEY);$('battleView').classList.add('hidden');$('setup').classList.remove('hidden');$('resume').classList.add('hidden');notice('Elegí tu equipo para la próxima práctica.');};
$('surrender').onclick=async()=>{if(busy||!session||session.status!=='playing'||!confirm('¿Rendirse de esta práctica?'))return;busy=true;try{const d=await api('/api/practice/'+token,{method:'POST',body:JSON.stringify({operation:'surrender'})});session=d.practice;showSession();notice(resultText());}catch(e){notice(e.message)}finally{busy=false;}};
(async()=>{try{const d=await api('/api/catalog');catalog=d.catalog;chart=d.chart||{};revision=d.revision;udPracticeLoadTeams();for(const [id,label] of Object.entries(TYPE_NAMES))$('practiceTypeFilter').add(new Option(label,id));for(let i=1;i<=8;i++)$('enemySize').insertAdjacentHTML('beforeend',`<option value="${i}" ${i===8?'selected':''}>${i} personajes</option>`);renderPracticeRoster();await refresh();}catch(e){notice('No se pudo cargar Práctica: '+e.message)}})();
