<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica — Universal Duels</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111421;color:#f2f1fa;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{padding:20px;background:#20243a;border:1px solid #444b71;border-radius:15px;margin:13px 0}h1{font-size:23px}h2{font-size:19px}button,select{background:#343a59;color:white;border:1px solid #7076a2;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#6556aa}.danger{background:#703748}label{display:grid;gap:5px;margin:7px 0}small,.subtle{color:#b7b9ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.roster{max-height:280px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}.roster label{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #4a4f6e;border-radius:8px}.hidden{display:none}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.team{border:1px solid #596083;border-radius:12px;padding:12px;margin:8px 0}.hp{height:10px;background:#672e41;border-radius:6px;overflow:hidden}.hp>div{height:100%;background:#52ba83}.moves{display:flex;flex-wrap:wrap;gap:8px}.alert{color:#ffd595}#log{max-height:210px;overflow:auto;white-space:pre-line;background:#131626;border-radius:8px;padding:10px}.stats{font-size:12px;color:#bfc0dc}
@keyframes udPortal{from{opacity:0;transform:scale(.15);filter:brightness(2.5) hue-rotate(100deg)}to{opacity:1;transform:scale(1);filter:none}}.ud-portal-arrive{animation:udPortal .65s ease-out both}@media(prefers-reduced-motion:reduce){.ud-portal-arrive{animation:none}}
</style></head><body><div class="wrap"><div class="row"><h1>Universal Duels · Práctica contra IA</h1><a href="/catalog.html" style="color:#bdb0ff">Catálogo</a><a href="/" style="color:#bdb0ff">Volver al juego</a></div><p class="subtle">Partidas privadas sin recompensas ni Refuerzos. No necesitan conexión con otro jugador.</p><div id="notice" role="status" class="alert"></div>
<section id="setup" class="panel"><h2>Crear una partida</h2><div class="grid"><label>Modalidad<select id="mode"><option value="singles">Singles</option><option value="doubles">Doubles</option></select></label><label>Dificultad<select id="difficulty"><option value="easy">Fácil</option><option value="advanced">Avanzada (base)</option></select></label><label>Equipo rival<select id="enemySize"></select></label></div><h3>Tu equipo (1 a 8 personajes)</h3><p id="selectionCount" class="subtle"></p><div id="roster" class="roster"></div><div class="row" style="margin-top:14px"><button id="start" class="primary">Comenzar Práctica</button><button id="random">Elegir 8 al azar</button><button id="resume" class="hidden">Reanudar partida pendiente</button></div></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><strong id="round"></strong><span id="expiration" class="subtle"></span></div><h3>Rivales</h3><div id="enemies" class="grid"></div><h3>Tu equipo activo</h3><div id="allies" class="grid"></div><h3 id="actionTitle">Seleccionar acciones</h3><div id="actions"></div><div class="row" style="margin-top:12px"><button id="confirm" class="primary">Confirmar turno</button><button id="surrender" class="danger">Rendirse</button><button id="new" class="hidden">Nueva práctica</button></div></div><div class="panel"><h3>Registro del combate</h3><div id="log"></div></div></section></div>
<script type="module">
import {createSoundDirector} from "/audio-director.js";const udSound=createSoundDirector();udSound.context("lobby");
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='universal-duels-practice-v1';let catalog,chart,revision,token=localStorage.getItem(KEY),session=null,selected=[],pending={};
const notice=(m)=>$('notice').textContent=m;
async function api(path,options={}){const r=await fetch(path,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const o=await r.json();if(!r.ok)throw Error(o.error||'No se pudo completar la operación.');return o;}
function entityName(id){return catalog?.entities?.[id]?.name||id}
function selection(){selected=[...document.querySelectorAll('#roster input:checked')].map(e=>e.value);$('selectionCount').textContent=`Seleccionados: ${selected.length}/8`;$('start').disabled=selected.length<1||selected.length>8;}
function setupRoster(){const list=Object.values(catalog.entities).sort((a,b)=>a.name.localeCompare(b.name));$('roster').innerHTML=list.map(e=>`<label><input type="checkbox" value="${esc(e.id)}" ${selected.includes(e.id)?'checked':''}><span>${esc(e.name)}</span></label>`).join('');$('roster').querySelectorAll('input').forEach(i=>i.onchange=()=>{if(document.querySelectorAll('#roster input:checked').length>8)i.checked=false;selection()});selection();}
function displayUnit(u){return`<div class="team"><strong>${esc(u.name)}</strong> ${u.hp<=0?'(KO)':''}<div class="stats">PS: ${u.hp} / ${u.maxHp}</div><div class="hp"><div style="width:${Math.max(0,Math.min(100,100*u.hp/u.maxHp))}%"></div></div><div class="stats">${(u.types||[]).map(esc).join(' · ')}</div></div>`}
function buildTargets(unit,move,slot){const targeting=move.definition?.targeting||'single';if(session.mode!=='doubles'||targeting!=='single')return'';const d=session.state,enemy=d.rightActive.filter(x=>x.hp>0),ally=d.leftActive.filter(x=>x.hp>0&&x.activeSlot!==slot);const options=[...enemy.map(x=>({side:'right',u:x})),...ally.map(x=>({side:'left',u:x}))];return`<select class="target" data-slot="${slot}">${options.map(({side,u})=>`<option value="${side}:${u.activeSlot}">${side==='right'?'Rival':'Aliado'}: ${esc(u.name)}</option>`).join('')}</select>`}
function availableSwitches(d){return d.leftTeam.map((u,i)=>({unit:u,index:i})).filter(({unit,index})=>unit.hp>0&&!d.leftActiveIndexes.includes(index));}
function actionEditor(){const d=session.state,required=session.phase==='replacement';$('actionTitle').textContent=required?'Elegí las sustituciones':'Seleccionar movimientos, cambios y objetivos';$('actions').innerHTML='';if(session.status==='finished'){ $('new').classList.remove('hidden');$('surrender').classList.add('hidden'); $('actionTitle').textContent='Resultado: '+({victory:'¡Victoria!',defeat:'Derrota',draw:'Empate',surrender:'Rendición'}[session.outcome]||session.outcome);$('confirm').disabled=true;return;}
 if(required){const needed=d.needsReplacement.left||[],available=availableSwitches(d);$('actions').innerHTML=needed.slice(0,available.length).map((slot,i)=>`<label>Espacio ${slot+1}<select class="replacement" data-slot="${slot}">${available.map(({unit,index},j)=>`<option value="${index}" ${j===i?'selected':''}>${esc(unit.name)}</option>`).join('')}</select></label>`).join('');}
 else{const available=availableSwitches(d);$('actions').innerHTML=d.leftActive.filter(u=>u.hp>0).map(u=>{const e=catalog.entities[u.id],ms=[...(e?.definition?.moveIds||[]),e?.definition?.uniqueMoveId].filter(Boolean).map(id=>catalog.moves[id]).filter(m=>m&&!(u.cooldowns?.[m.id]>0));const candidates=[...ms.map(m=>`<option value="move:${esc(m.id)}">${esc(m.name)} (${Number(m.definition.power)||0} poder)</option>`),...available.map(({unit,index})=>`<option value="switch:${index}">Cambiar por ${esc(unit.name)}</option>`)];return`<div class="team" data-actor="${u.activeSlot}"><strong>${esc(u.name)}</strong><label>Acción<select class="move" data-slot="${u.activeSlot}">${candidates.join('')}</select></label><div class="target-box">${ms[0]?buildTargets(u,ms[0],u.activeSlot):''}</div></div>`}).join('');document.querySelectorAll('.move').forEach(sel=>sel.onchange=()=>{const card=sel.closest('[data-actor]'),unit=d.leftActive.find(x=>x.activeSlot===Number(sel.dataset.slot));card.querySelector('.target-box').innerHTML=sel.value.startsWith('move:')?buildTargets(unit,catalog.moves[sel.value.slice(5)],unit.activeSlot):'';});}
 $('confirm').disabled=false;$('new').classList.add('hidden');$('surrender').classList.remove('hidden');
}
let lastPracticeActive=null;function draw(){if(!session)return;const nowActive={left:session.state.leftActive.map(u=>u.teamIndex??u.id),right:session.state.rightActive.map(u=>u.teamIndex??u.id)};const changed=lastPracticeActive&&JSON.stringify(lastPracticeActive)!==JSON.stringify(nowActive);lastPracticeActive=nowActive;const sc=catalog?.scenarios?.[session.state?.scenario]?.definition||{};udSound.context('battle',{scenarioId:session.state?.scenario,soundId:sc.soundId,scenarioVolume:Number(sc.soundVolume??100),revision});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('round').textContent=`Ronda ${session.round} · ${session.mode==='doubles'?'Doubles':'Singles'}`;$('expiration').textContent=`Disponible hasta ${new Date(session.expiresAt).toLocaleString('es-CR')}`;$('enemies').innerHTML=session.state.rightActive.map(displayUnit).join('');$('allies').innerHTML=session.state.leftActive.map(displayUnit).join('');$('log').textContent=session.state.log.slice(-35).join('\n');if(changed){udSound.effect('portal-in');document.querySelectorAll('#allies .team,#enemies .team').forEach(el=>el.classList.add('ud-portal-arrive'));}actionEditor();}
async function refresh(){if(!token){$('resume').classList.add('hidden');return;}try{const d=await api('/api/practice/'+token);session=d.practice;if(session.status==='playing'){$('resume').classList.remove('hidden');$('resume').textContent='Reanudar partida (ronda '+session.round+')';}else{$('resume').classList.add('hidden');}}catch(e){localStorage.removeItem(KEY);token=null;session=null;$('resume').classList.add('hidden');notice(e.message)}}
$('resume').onclick=()=>draw();
$('start').onclick=async()=>{try{
  // One resumable match per browser; finishing it unlocks the next.
  if(session?.status==='playing'){draw();notice('Ya tenés una práctica en curso. Continuá esa partida.');return;}
  if(!token){token=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(KEY,token);}
  const all=Object.keys(catalog.entities),size=Number($('enemySize').value),opponents=[...all].sort(()=>Math.random()-.5).slice(0,size);
  const d=await api('/api/practice',{method:'POST',body:JSON.stringify({token,mode:$('mode').value,difficulty:$('difficulty').value,leftTeam:selected,rightTeam:opponents})});
  token=d.token;localStorage.setItem(KEY,token);session=d.practice;draw();
  notice(d.resumed?'Práctica reanudada.':'Práctica iniciada. Si salís, podés continuarla al volver.');
}catch(e){notice(e.message)}};
$('random').onclick=()=>{selected=Object.keys(catalog.entities).sort(()=>Math.random()-.5).slice(0,8);setupRoster()};
$('confirm').onclick=async()=>{try{let data;if(session.phase==='replacement'){data={operation:'replacement',choices:[...document.querySelectorAll('.replacement')].map(x=>({slot:Number(x.dataset.slot),teamIndex:Number(x.value)}))};}else{const actions=[...document.querySelectorAll('.move')].map(x=>{const result={slot:Number(x.dataset.slot)};if(x.value.startsWith('switch:')){result.switch=Number(x.value.slice(7));return result;}result.move=x.value.slice(5);const target=x.closest('.team').querySelector('.target');if(target){const [side,slot]=target.value.split(':');result.target={side,slot:Number(slot)}}return result;});const changes=actions.filter(x=>x.switch!==undefined).map(x=>x.switch);if(new Set(changes).size!==changes.length)throw Error('No podés cambiar dos personajes por la misma reserva.');data={operation:'turn',order:session.mode==='singles'?actions[0]:{actions}};}const res=await api('/api/practice/'+token,{method:'POST',body:JSON.stringify(data)});session=res.practice;draw();notice('Progreso guardado.');}catch(e){notice(e.message)}};
$('surrender').onclick=async()=>{if(!confirm('¿Rendirse de esta práctica?'))return;try{const r=await api('/api/practice/'+token,{method:'POST',body:JSON.stringify({operation:'surrender'})});session=r.practice;draw();}catch(e){notice(e.message)}};
$('new').onclick=()=>{if(session?.status!=='finished')return;session=null;token=null;localStorage.removeItem(KEY);$('game').classList.add('hidden');$('setup').classList.remove('hidden');$('resume').classList.add('hidden');udSound.context('lobby',{revision});notice('Elegí tu equipo para la próxima partida.');};
(async()=>{try{const d=await api('/api/catalog');catalog=d.catalog;chart=d.chart;revision=d.revision;for(let i=1;i<=8;i++)$('enemySize').insertAdjacentHTML('beforeend',`<option value="${i}" ${i===8?'selected':''}>${i} personajes</option>`);setupRoster();await refresh();}catch(e){notice('No se pudo cargar Práctica: '+e.message)}})();
</script></body></html>
