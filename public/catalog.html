<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo · Universal Duels</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10131f;color:#f4f2fc;font:15px/1.5 system-ui,sans-serif}a{color:#cabdff}.wrap{max-width:1150px;margin:auto;padding:24px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:#20243a;border:1px solid #393d57;border-radius:14px;padding:18px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}.card{background:#292d46;border:1px solid #4a4f70;border-radius:12px;padding:14px;color:inherit;text-align:left;cursor:pointer}.card:hover,.card:focus-visible{outline:2px solid #b4a4ff}.card img{width:90px;height:90px;object-fit:contain;image-rendering:pixelated;display:block;margin:auto}.types{font-size:12px;color:#9de6cb}.muted{color:#b3b5c9}input{padding:12px;background:#15192b;color:white;border:1px solid #525876;border-radius:9px;width:min(100%,350px)}button{background:#343a60;color:white;border:1px solid #596291;border-radius:9px;padding:9px;cursor:pointer}.details{max-width:780px;margin:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}.stat{background:#282d43;border-radius:8px;padding:9px}.ref{display:inline-flex;margin:4px;padding:8px;gap:4px;background:#343956}.rule{padding:12px;margin:9px 0;background:#242940;border-radius:10px;white-space:pre-wrap}h3{margin-bottom:7px}.stat strong{display:block}
.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 10px 20px #0006)}.brand-row{justify-content:space-between;align-items:center}.brand-text{display:flex;flex-direction:column}.type-icon-list{display:inline-flex;flex-wrap:wrap;gap:7px;align-items:center}.type-icon{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}.type-icon img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated}.type-icon img[hidden],.type-icon span[hidden]{display:none!important}.ud-sprite-preview{width:90px;height:90px;position:relative;overflow:hidden;margin:0 auto}.ud-sprite-preview img{max-width:none}.ud-sprite-preview .ud-sprite-rendered{display:block;width:100%;height:100%;image-rendering:pixelated}.detail-sprite{width:160px;height:160px;margin:12px auto}.detail-sprite img{width:320px;height:160px;object-fit:fill}
/* Six vertical base-stat bars, independent heights, 0=red / max=green. */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;margin:20px 0 25px;min-height:225px}
.stat{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;background:#282d43;border:1px solid #454966;border-radius:10px;padding:9px 3px}
.stat strong{display:block;font-size:11px;line-height:1.18;min-height:28px;hyphens:auto;overflow-wrap:anywhere}
.stat .stat-value{font-weight:900;margin:2px 0 7px;font-size:14px}
.stat-track{display:flex;align-items:end;width:23px;height:135px;background:#14182a;border-radius:5px;overflow:hidden;border:1px solid #515772}
.stat-fill{display:block;width:100%;height:var(--stat-percent);background:var(--stat-color);transition:height .35s ease,background .35s ease;border-radius:4px 4px 0 0}
.related-links{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}.related-links h3{flex:0 0 100%;margin:0}
@media(max-width:600px){.stats{gap:3px}.stat{padding:5px 1px}.stat-track{width:15px;height:112px}.stat strong{font-size:9px}.stat .stat-value{font-size:11px}}
</style></head><body><div class="wrap"><div class="row brand-row"><div class="brand"><img class="brand-logo" src="/assets/universal-duels-logo.png" alt="Universal Duels"><div class="brand-text"><h1>Catálogo de Universal Duels</h1></div></div><a href="/">← Volver al juego</a></div>
<p class="muted">Personajes, estadísticas, movimientos, habilidades y sus relaciones. El catálogo corresponde al parche publicado.</p>
<section id="browse" class="panel"><label for="search">Buscar personajes</label><div><input id="search" placeholder="Nombre o #etiqueta" autocomplete="off"></div><p id="count" class="muted"></p><div id="cards" class="cards"></div></section>
<section id="details" class="panel details" hidden><div class="row"><button id="back">← Volver</button><span id="revision" class="muted"></span></div><div id="detail"></div></section>
<p id="notice" class="muted" role="status">Cargando catálogo…</p></div>
<script src="/sprite-renderer.js"></script><script src="/type-icon-cleanup.js"></script><script type="module">
const $=id=>document.getElementById(id);let data,history=[];
const text=(tag,value,className)=>{const e=document.createElement(tag);e.textContent=String(value??'');if(className)e.className=className;return e;};
const append=(to,...items)=>items.forEach(item=>to.appendChild(item));
const name=(cat,id)=>data?.catalog?.[cat]?.[id]?.name||id;
function typeBadge(type){
  const el=document.createElement('span');el.className='type-icon';
  const label=text('span',String(type));
  const img=document.createElement('img');img.hidden=true;img.alt='';img.src='/api/type-icons/'+encodeURIComponent(type)+'?revision='+encodeURIComponent(data.revision);
  img.onload=()=>{if(img.naturalWidth){img.hidden=false;label.hidden=true;}};
  img.onerror=()=>{img.hidden=true;label.hidden=false;};
  el.title=String(type);el.append(label,img);return el;
}
function addTypes(to,types){const line=document.createElement('div');line.className='type-icon-list';for(const type of types)line.append(typeBadge(type));to.appendChild(line);}
function spritePreview(url,large=false){const win=document.createElement('div');win.className='ud-sprite-preview'+(large?' detail-sprite':'');win.dataset.view='front';const img=document.createElement('img');img.className='battle-sprite-sheet';img.alt='Vista frontal';img.src=url;win.append(img);return win;}
function link(cat,id){const button=text('button',name(cat,id),'ref');button.addEventListener('click',()=>open(cat,id));return button;}
function showList(){if(history.length)history.pop();$('browse').hidden=false;$('details').hidden=true;$('search').focus({preventScroll:true});}
function field(to,label,value){const row=text('p',`${label}: ${value??'—'}`);to.appendChild(row);}
function refs(to,cat,label,ids){const section=document.createElement('div');append(section,text('h3',label));
  for(const id of ids.filter(Boolean))append(section,link(cat,id));if(!ids.filter(Boolean).length)append(section,text('p','Ninguno','muted'));to.appendChild(section);}
const LINKED_CATEGORIES={
  apply_status:'statuses',remove_status:'statuses',apply_effect:'effects',remove_effect:'effects',
  set_weather:'weathers',set_field:'fields',set_scenario:'scenarios',
  apply_weather:'weathers',apply_field:'fields',apply_scenario:'scenarios'
};
function linkedEntries(definition){
  const buckets={statuses:new Set(),effects:new Set(),weathers:new Set(),fields:new Set(),scenarios:new Set()};
  const seen=new WeakSet();
  function collect(node,depth=0){
    if(!node||typeof node!=='object'||depth>15||seen.has(node))return;
    seen.add(node);
    if(!Array.isArray(node)){
      const category=LINKED_CATEGORIES[node.type];
      if(category&&typeof node.value==='string'&&data.catalog[category]?.[node.value])buckets[category].add(node.value);
      for(const [key,cat] of [['effectId','effects'],['statusId','statuses'],['weatherId','weathers'],['fieldId','fields'],['scenarioId','scenarios']])
        if(typeof node[key]==='string'&&data.catalog[cat]?.[node[key]])buckets[cat].add(node[key]);
      for(const [key,cat] of [['effectIds','effects'],['statusIds','statuses'],['weatherIds','weathers'],['fieldIds','fields'],['scenarioIds','scenarios']])
        if(Array.isArray(node[key]))for(const id of node[key])if(typeof id==='string'&&data.catalog[cat]?.[id])buckets[cat].add(id);
    }
    for(const value of Object.values(node))if(value&&typeof value==='object')collect(value,depth+1);
  }
  collect(definition);return buckets;
}
function showAssociated(to,definition){
  const linked=linkedEntries(definition);
  for(const [category,label] of [['statuses','Estados asociados'],['effects','Efectos asociados'],['weathers','Climas asociados'],['fields','Campos asociados'],['scenarios','Escenarios asociados']]){
    if(!linked[category].size)continue;
    const section=document.createElement('section');section.className='related-links';section.appendChild(text('h3',label));
    for(const id of linked[category])section.appendChild(link(category,id));to.appendChild(section);
  }
}
function showStats(to,d){
  const stats=document.createElement('div');stats.className='stats';stats.setAttribute('aria-label','Estadísticas base');
  for(const [label,key,max] of [['PS','hp',1000],['Ataque','attack',200],['Defensa','defense',200],['Ataque especial','specialAttack',200],['Defensa especial','specialDefense',200],['Velocidad','speed',200]]){
    const v=Number(d[key]??0),ratio=Math.max(0,Math.min(1,(Number.isFinite(v)?v:0)/max));
    const tile=document.createElement('div');tile.className='stat';tile.title=`${label}: ${v} de ${max}`;
    const track=document.createElement('div');track.className='stat-track';track.setAttribute('role','img');track.setAttribute('aria-label',`${label} ${v} de ${max}`);
    const bar=document.createElement('span');bar.className='stat-fill';bar.style.setProperty('--stat-percent',`${ratio*100}%`);bar.style.setProperty('--stat-color',`hsl(${Math.round(ratio*120)} 78% 44%)`);
    track.appendChild(bar);tile.append(text('strong',label),text('span',v,'stat-value'),track);stats.appendChild(tile);
  }to.appendChild(stats);
}
function open(cat,id){const item=data?.catalog?.[cat]?.[id];if(!item){$('notice').textContent='Referencia no encontrada: '+cat+'/'+id;return;}
  history.push([cat,id]);$('browse').hidden=true;$('details').hidden=false;$('revision').textContent=data.revision;
  const panel=$('detail');panel.replaceChildren(text('h2',item.name),text('p',item.description||item.definition?.description||'Sin descripción registrada.','muted'));
  const d=item.definition||{};
  if(cat==='entities'){
    if(d.spriteId){const url='/api/sprites/'+encodeURIComponent(d.spriteId)+'?revision='+encodeURIComponent(data.revision);panel.append(spritePreview(url,true));}
    addTypes(panel,d.types||[]);showStats(panel,d);
    refs(panel,'moves','Movimientos globales',d.moveIds||[]);refs(panel,'moves','Movimiento exclusivo',[d.uniqueMoveId]);
    refs(panel,'abilities','Habilidad global',[d.globalAbilityId]);
    const tags=[...new Set([...(d.tags||[]),...Object.values(data.catalog.tags||{}).filter(t=>t.definition?.entityIds?.includes(id)).map(t=>t.name)])];
    if(tags.length){const section=document.createElement('div');section.className='related-links';section.appendChild(text('h3','Etiquetas'));for(const tag of tags){const b=text('button','#'+tag,'ref');b.onclick=()=>{$('search').value='#'+tag;history=[];showList();render();};section.appendChild(b);}panel.appendChild(section);}
    refs(panel,'abilities','Habilidad exclusiva',[d.uniqueAbilityId]);
  }else{
    // The player's catalog exposes descriptions and browsable references only.
    // Never reveal conditions, internal event codes, probabilities or rule JSON.
    showAssociated(panel,d);
  }
  window.UDTypeIcons?.mount(panel);window.UDSprites?.mount(panel);panel.scrollIntoView({behavior:'smooth',block:'start'});
}
$('back').onclick=()=>{history.pop();if(history.length){const [cat,id]=history.pop();open(cat,id);}else showList();};
function render(){const q=$('search').value.trim().toLocaleLowerCase('es'),entries=Object.values(data.catalog.entities||{}).filter(e=>{
  const d=e.definition||{};const tags=[...(d.tags||[]),...Object.values(data.catalog.tags||{}).filter(t=>t.definition?.entityIds?.includes(e.id)).map(t=>t.name)];return q.startsWith('#')?tags.some(t=>String(t).toLocaleLowerCase('es').includes(q.slice(1))):e.name.toLocaleLowerCase('es').includes(q);
}).sort((a,b)=>a.name.localeCompare(b.name,'es'));$('cards').replaceChildren();$('count').textContent=entries.length+' personajes';
for(const e of entries){const card=document.createElement('button');card.className='card';
  const d=e.definition||{};if(d.spriteId){const url='/api/sprites/'+encodeURIComponent(d.spriteId)+'?revision='+encodeURIComponent(data.revision);card.append(spritePreview(url));}
  card.append(text('strong',e.name));addTypes(card,d.types||[]);card.onclick=()=>open('entities',e.id);$('cards').appendChild(card);}
window.UDTypeIcons?.mount($('cards'));window.UDSprites?.mount($('cards'));
}
$('search').oninput=render;
(async()=>{try{const r=await fetch('/api/catalog',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'No se pudo cargar el catálogo.');data=d;render();$('notice').textContent='Catálogo actualizado a '+d.revision;
  const params=new URLSearchParams(location.search),id=params.get('entity');if(id&&d.catalog.entities?.[id])open('entities',id);
}catch(e){$('notice').textContent='Error: '+e.message;}})();
</script><script type="module">import {createSoundDirector} from '/audio-director.js';window.udSound=createSoundDirector();window.udSound.context('lobby');</script></body></html>
