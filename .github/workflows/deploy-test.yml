name: Entorno de ensayo aislado — despliegue manual

on:
  workflow_dispatch:
    inputs:
      confirm_isolation:
        description: 'Escribí ENTORNO_AISLADO para confirmar recursos de prueba separados'
        required: true
        type: string

permissions:
  contents: read
jobs:
  deploy-test:
    if: ${{ inputs.confirm_isolation == 'ENTORNO_AISLADO' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar que los recursos aislados estén configurados
        run: |
          if grep -q 'CONFIGURE_ISOLATED' wrangler.test.toml; then
            echo 'ERROR: Primero configurar KV y R2 reales exclusivos de pruebas.'
            exit 1
          fi
      - name: Todas las pruebas locales
        run: npm test
      - name: Compilación de ensayo sin desplegar
        run: npx wrangler deploy --config wrangler.test.toml --dry-run --outdir ./dist-alpha04-test
      - name: Desplegar SOLO Worker de prueba autorizado
        run: npx wrangler deploy --config wrangler.test.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
