name: Validar Alpha 0.4 sin desplegar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias locales del proyecto
        run: npm install --no-audit --no-fund
      - name: Pruebas automatizadas
        run: npm test
      - name: Comprobar compilación de Wrangler SIN DESPLEGAR
        run: npx wrangler deploy --dry-run --outdir ./dist-alpha04
