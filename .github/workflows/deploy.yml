name: Publicación manual con validación completa

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Escribí PUBLICAR_ALPHA04 para autorizar el despliegue (no automático)'
        required: true
        type: string

permissions:
  contents: read
jobs:
  deploy:
    if: ${{ inputs.confirm_release == 'PUBLICAR_ALPHA04' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Todas las pruebas antes de tocar Cloudflare
        run: npm test
      - name: Compilación sin desplegar
        run: npx wrangler deploy --dry-run --outdir ./dist-alpha04
      - name: Despliegue ÚNICAMENTE por ejecución manual confirmada
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
